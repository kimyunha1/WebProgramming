<body>
    <header>

    <main>
        <section class="dog-detail">
            <h1>두부</h1>

            <div class="dog-photos">
                <img src="9_retriever.jpg" alt="골든 리트리버 강아지" width="400">
            </div>

            <div class="dog-info">
                <h2>두부의 기본 정보</h2>
                <p>견종: 골든 리트리버</p>
                <p>나이: 약 1살</p>

                <p>안녕하세요, 서울 보호센터입니다.</p>
                <p>오늘은 새로운 가족을 기다리는 골든 리트리버 <strong>두부</strong>를 소개할게요!</p>
                <p>두부는 사람을 아주 좋아하고 산책할 때 가장 신나합니다.</p>
                <p>다른 강아지와도 잘 지내는 편이에요.</p>
                <p>매력적인 외모뿐 아니라 애교도 많아서 누구나 금방 정이 들 거예요.</p>
                <p>두부의 새 가족이 되어주실 분을 기다리고 있어요</p>
            </div>

            <p><a href="adopt-list.html#seoul">목록으로 돌아가기</a></p>
